<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>現地調査レポート作成</title>

    <!-- ExcelJS（.xlsx生成） -->
    <script src="./lib/exceljs.min.js"></script>
    <!-- FileSaver（ダウンロード） -->
    <script src="./lib/FileSaver.min.js"></script>

    <style>
      :root {
        --bg: #f7f8fa;
        --card: #ffffff;
        --text: #222;
        --muted: #666;
        --primary: #2d7ef7;
        --success: #2fa36b;
        --border: #e5e7eb;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      }
      .app-header, .app-footer {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }
      .app-footer { border-top: 1px solid var(--border); border-bottom: none; text-align: center; }
      .container { max-width: 980px; margin: 0 auto; padding: 16px; }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      }
      h1, h2, h3 { margin: 0 0 12px; }
      .form-row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
      .form-row label { color: var(--muted); }
      input[type="text"], input[type="date"], textarea {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 16px;
      }
      textarea { min-height: 96px; resize: vertical; } /* 高さのみ変更可能（幅は固定） */
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
      .btn {
        padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
        background: #fff; color: var(--text); font-size: 16px; cursor: pointer;
      }
      .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
      .btn.success { background: var(--success); color: #fff; border-color: var(--success); }
      .btn:active { transform: scale(0.98); }

      .category-list { display: flex; flex-wrap: wrap; gap: 10px 16px; }
      .category-item { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; }

      .photos { margin-top: 8px; }
      .photo-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
      }
      .photo-item {
        background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      }
      .photo-item img { width: 100%; height: 120px; object-fit: cover; display: block; }
      .photo-item .caption {
        padding: 8px;
        border-top: 1px solid var(--border);
      }
      .photo-item .caption input {
        width: 100%; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
      }
      .photo-item .footer {
        padding: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted);
      }
      .photo-item .remove {
        background: transparent; border: none; color: #c0392b; cursor: pointer; font-size: 12px;
      }

      @media (max-width: 720px) {
        .form-row { grid-template-columns: 1fr; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>現地調査レポート作成</h1>
    </header>

    <main class="container">
      <!-- 案件全体の情報（表紙） -->
      <section class="card">
        <h2>案件情報（表紙）</h2>
        <div class="form-row">
          <label for="projectTitle">案件名</label>
          <input id="projectTitle" type="text" placeholder="例：〇〇地区現地調査" />
        </div>
        <div class="form-row">
          <label for="projectDate">調査日（全項目へ自動反映／後から個別変更可）</label>
          <input id="projectDate" type="date" />
        </div>
      </section>

      <!-- カテゴリ選択 -->
      <section class="card">
        <h2>カテゴリ選択（目次・カテゴリ別シートに反映）</h2>
        <div class="category-list" id="categorySelectArea"></div>
        <div style="margin-top:10px; display:flex; gap:8px;">
          <input id="newCategoryInput" type="text" placeholder="カテゴリを追加（例：外構・電気・配管など）" />
          <button id="addCategoryBtn" class="btn">カテゴリを追加</button>
        </div>
      </section>

      <!-- 選択したカテゴリの入力ブロック -->
      <section class="card">
        <h2>カテゴリ別入力</h2>
        <div id="categoriesContainer"></div>
      </section>

      <!-- 操作 -->
      <section class="card">
        <h2>操作</h2>
        <div class="buttons">
          <button id="saveBtn" class="btn">下書きを保存</button>
          <button id="loadBtn" class="btn">下書きを読み込み</button>
          <button id="exportExcelBtn" class="btn success">Excelにエクスポート</button>
        </div>
        <p style="color:var(--muted); font-size:12px; margin-top:8px;">
          ヒント：Excelは端末にダウンロードされます。<br/>
          調査日（表紙）を入力すると各カテゴリに自動反映され、必要に応じて個別で上書きできます。
        </p>
      </section>
    </main>

    <footer class="app-footer">
      <small>© 現地調査レポートツール</small>
    </footer>

    <script>
      // 初期カテゴリ
      const defaultCategories = ['外観', '内装', '設備', '安全衛生'];

      // 状態：選択中カテゴリとデータ
      // dataMap[cat] = { date:'', location:'', details:'', photos:[{dataUrl,name,caption}] }
      const dataMap = {};
      const selectedCategories = new Set();

      // 参照
      const projectTitleEl = document.getElementById('projectTitle');
      const projectDateEl = document.getElementById('projectDate');
      const categorySelectArea = document.getElementById('categorySelectArea');
      const newCategoryInput = document.getElementById('newCategoryInput');
      const addCategoryBtn = document.getElementById('addCategoryBtn');
      const categoriesContainer = document.getElementById('categoriesContainer');
      const saveBtn = document.getElementById('saveBtn');
      const loadBtn = document.getElementById('loadBtn');
      const exportExcelBtn = document.getElementById('exportExcelBtn');

      // 前回の表紙調査日（自動反映の上書き判定用）
      let projectDatePrev = '';

      // カテゴリ選択UIの描画
      function renderCategorySelector() {
        categorySelectArea.innerHTML = '';
        const allCats = [...new Set([...defaultCategories, ...Object.keys(dataMap)])].sort((a,b)=>a.localeCompare(b,'ja'));
        allCats.forEach(cat => {
          const id = 'cat_' + hashId(cat);
          const wrapper = document.createElement('label');
          wrapper.className = 'category-item';
          wrapper.innerHTML = `
            <input type="checkbox" id="${id}" ${selectedCategories.has(cat) ? 'checked':''}>
            <span>${cat}</span>
          `;
          wrapper.querySelector('input').addEventListener('change', (e) => {
            if (e.target.checked) {
              selectCategory(cat);
            } else {
              deselectCategory(cat);
            }
          });
          categorySelectArea.appendChild(wrapper);
        });
      }

      // カテゴリ選択
      function selectCategory(cat) {
        if (!dataMap[cat]) {
          dataMap[cat] = { date:'', location:'', details:'', photos:[] };
        }
        // 初期表示時、カテゴリの日付が空で表紙調査日があるなら初期値として反映
        if (!dataMap[cat].date && projectDateEl.value) {
          dataMap[cat].date = projectDateEl.value;
        }
        selectedCategories.add(cat);
        renderCategories();
      }

      // カテゴリ選択解除
      function deselectCategory(cat) {
        selectedCategories.delete(cat);
        const el = document.getElementById('catBlock_' + hashId(cat));
        if (el) el.remove();
        renderCategorySelector(); // チェック状態更新
      }

      addCategoryBtn.addEventListener('click', () => {
        const name = (newCategoryInput.value || '').trim();
        if (!name) return;
        if (!dataMap[name]) dataMap[name] = { date:'', location:'', details:'', photos:[] };
        // 初期値反映
        if (!dataMap[name].date && projectDateEl.value) {
          dataMap[name].date = projectDateEl.value;
        }
        selectedCategories.add(name);
        newCategoryInput.value = '';
        renderCategorySelector();
        renderCategories();
      });

      // 表紙の調査日変更 → 各カテゴリへ自動反映（ただし個別変更は保持）
      projectDateEl.addEventListener('change', (e) => {
        const newDate = e.target.value || '';
        [...selectedCategories].forEach(cat => {
          const v = dataMap[cat] || (dataMap[cat] = { date:'', location:'', details:'', photos:[] });
          // 以前の表紙日付と同一、または未設定のものだけ更新（個別上書きは保持）
          if (!v.date || v.date === projectDatePrev) {
            v.date = newDate;
            const idBase = hashId(cat);
            const dateInput = document.getElementById('date_' + idBase);
            if (dateInput) dateInput.value = newDate;
          }
        });
        projectDatePrev = newDate;
      });

      // カテゴリ別入力ブロックの描画
      function renderCategories() {
        categoriesContainer.innerHTML = '';
        [...selectedCategories].forEach(cat => {
          categoriesContainer.appendChild(buildCategoryBlock(cat));
        });
        renderCategorySelector(); // 選択状態の同期
      }

      // カテゴリ入力ブロック生成
      function buildCategoryBlock(cat) {
        const idBase = hashId(cat);
        const block = document.createElement('div');
        block.className = 'card';
        block.id = 'catBlock_' + idBase;

        const v = dataMap[cat];

        block.innerHTML = `
          <h3>${escapeHtml(cat)}</h3>
          <div class="form-row">
            <label for="date_${idBase}">調査日</label>
            <input id="date_${idBase}" type="date" value="${v.date || ''}" />
          </div>
          <div class="form-row">
            <label for="loc_${idBase}">場所</label>
            <input id="loc_${idBase}" type="text" placeholder="設置する箇所をなるべく詳細に記載" value="${v.location || ''}" />
          </div>
          <div class="form-row">
            <label for="det_${idBase}">調査内容</label>
            <textarea id="det_${idBase}" placeholder="現地での観察事項、寸法、注意点など">${v.details || ''}</textarea>
          </div>

          <div class="form-row">
            <label>写真</label>
            <div>
              <div class="buttons">
                <input id="cam_${idBase}" type="file" accept="image/*" capture="environment" multiple style="display:none" />
                <button id="camBtn_${idBase}" class="btn primary">撮影する（カメラ）</button>

                <input id="file_${idBase}" type="file" accept="image/*" multiple style="display:none" />
                <button id="fileBtn_${idBase}" class="btn">画像を選択</button>
              </div>
              <div class="photos">
                <div id="list_${idBase}" class="photo-list"></div>
              </div>
            </div>
          </div>
        `;

        // 値の同期
        block.querySelector('#date_' + idBase).addEventListener('change', (e) => v.date = e.target.value);
        block.querySelector('#loc_' + idBase).addEventListener('input', (e) => v.location = e.target.value);
        block.querySelector('#det_' + idBase).addEventListener('input', (e) => v.details = e.target.value);

        // 画像ボタンと入力
        const camInput = block.querySelector('#cam_' + idBase);
        const fileInput = block.querySelector('#file_' + idBase);
        block.querySelector('#camBtn_' + idBase).addEventListener('click', () => camInput.click());
        block.querySelector('#fileBtn_' + idBase).addEventListener('click', () => fileInput.click());

        camInput.addEventListener('change', (e) => handleFilesForCategory(cat, e.target.files));
        fileInput.addEventListener('change', (e) => handleFilesForCategory(cat, e.target.files));

        // 写真一覧描画
        renderPhotoList(cat, block.querySelector('#list_' + idBase));

        return block;
      }

      // 指定カテゴリにファイル追加
      async function handleFilesForCategory(cat, fileList) {
        const v = dataMap[cat] || (dataMap[cat] = { date:'', location:'', details:'', photos:[] });
        for (const file of fileList) {
          if (!file.type.startsWith('image/')) continue;
          const dataUrl = await readFileAsDataURL(file);
          const resized = await resizeImage(dataUrl, 1280);
          v.photos.push({ dataUrl: resized, name: file.name, caption: '' });
        }
        const idBase = hashId(cat);
        const listEl = document.getElementById('list_' + idBase);
        if (listEl) renderPhotoList(cat, listEl);
      }

      // 写真一覧（キャプション付き）
      function renderPhotoList(cat, listEl) {
        const v = dataMap[cat];
        listEl.innerHTML = '';
        v.photos.forEach((p, idx) => {
          const item = document.createElement('div');
          item.className = 'photo-item';
          item.innerHTML = `
            <img src="${p.dataUrl}" alt="photo ${idx+1}">
            <div class="caption">
              <input type="text" placeholder="説明（キャプション）" value="${p.caption || ''}" />
            </div>
            <div class="footer">
              <span>${p.name || `photo_${idx+1}.jpg`}</span>
              <button class="remove">削除</button>
            </div>
          `;
          item.querySelector('input').addEventListener('input', (e)=> { p.caption = e.target.value || ''; });
          item.querySelector('.remove').addEventListener('click', ()=> {
            v.photos.splice(idx, 1);
            renderPhotoList(cat, listEl);
          });
          listEl.appendChild(item);
        });
      }

      // 画像読み込み/リサイズユーティリティ
      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
      function resizeImage(dataUrl, maxWidth) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
            ctx.drawImage(img, 0, 0, w, h);
            const out = canvas.toDataURL('image/jpeg', 0.85);
            resolve(out);
          };
          img.src = dataUrl;
        });
      }

      // 下書き保存・読み込み
      saveBtn.addEventListener('click', () => {
        const payload = {
          projectTitle: projectTitleEl.value || '',
          projectDate: projectDateEl.value || '',
          selected: [...selectedCategories],
          data: dataMap
        };
        localStorage.setItem('surveyDraftV2', JSON.stringify(payload));
        alert('下書きを保存しました');
      });
      loadBtn.addEventListener('click', () => {
        const raw = localStorage.getItem('surveyDraftV2');
        if (!raw) { alert('保存された下書きがありません'); return; }
        try {
          const payload = JSON.parse(raw);
          projectTitleEl.value = payload.projectTitle || '';
          projectDateEl.value = payload.projectDate || '';
          projectDatePrev = payload.projectDate || '';

          Object.keys(dataMap).forEach(k => delete dataMap[k]);
          Object.assign(dataMap, payload.data || {});
          selectedCategories.clear();
          (payload.selected || []).forEach(c => selectedCategories.add(c));
          renderCategorySelector();
          renderCategories();
          alert('下書きを読み込みました');
        } catch {
          alert('読み込みに失敗しました');
        }
      });

      // 初期描画
      defaultCategories.forEach(c => { dataMap[c] = dataMap[c] || { date:'', location:'', details:'', photos:[] }; });
      renderCategorySelector();

      // Excel出力（体裁調整）
      exportExcelBtn.addEventListener('click', async () => {
        const title = (projectTitleEl.value || '').trim() || '-';
        const cats = [...selectedCategories];

        const ExcelJSRef = window.ExcelJS;
        const wb = new ExcelJSRef.Workbook();
        wb.creator = '現地調査レポートツール';
        wb.created = new Date();
        wb.properties.title = '現地調査報告書';

        const labelStyle = { font: { bold: true, name: 'Meiryo' } };
        const sectionTitleStyle = { font: { size: 14, bold: true, name: 'Meiryo' } };
        const borderThin = { style: 'thin', color: { argb: 'FF999999' } };

        // 表紙
        const wsCover = wb.addWorksheet('表紙', {
          pageSetup: { paperSize: 9, orientation: 'portrait',
            margins: { left: 0.7, right: 0.7, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 } },
          headerFooter: { oddFooter: '&Rページ &P / &N' }
        });
        for (let i=1;i<=8;i++) wsCover.getColumn(i).width = 16;
        wsCover.mergeCells('A3:H6');
        wsCover.getCell('A3').value = '現地調査報告書';
        wsCover.getCell('A3').style = { font: { size: 20, bold: true, name: 'Meiryo' }, alignment: { horizontal: 'center', vertical: 'middle' } };

        wsCover.getCell('A8').value = '案件名';
        wsCover.getCell('A8').style = labelStyle;
        wsCover.mergeCells('B8:H8');
        wsCover.getCell('B8').value = title;

        wsCover.getCell('A10').value = '調査日';
        wsCover.getCell('A10').style = labelStyle;
        wsCover.mergeCells('B10:H10');
        const exportDateStr = formatDate(new Date());
        const projectDateStr = projectDateEl.value || '';
        wsCover.getCell('B10').value = projectDateStr || exportDateStr;
        wsCover.getCell('B10').numFmt = 'yyyy-mm-dd';

        // 目次
        const wsToc = wb.addWorksheet('目次', {
          pageSetup: { paperSize: 9, orientation: 'portrait' },
          headerFooter: { oddFooter: '&Rページ &P / &N' }
        });
        wsToc.getColumn(1).width = 40;
        wsToc.getColumn(2).width = 18;
        wsToc.getCell('A1').value = '目次';
        wsToc.getCell('A1').style = sectionTitleStyle;

        const sheetNameMap = {};
        const usedNames = new Set();
        cats.forEach(cat => {
          const name = makeUniqueSheetName(sanitizeSheetName(cat), usedNames);
          sheetNameMap[cat] = name; usedNames.add(name);
        });

        let tocRow = 3;
        cats.forEach(cat => {
          wsToc.getCell(`A${tocRow}`).value = { text: cat, hyperlink: `#'${sheetNameMap[cat]}'!A1` };
          wsToc.getCell(`A${tocRow}`).font = { color: { argb: 'FF1F4E79' }, underline: true, name: 'Meiryo' };
          const photoCount = (dataMap[cat]?.photos || []).length;
          wsToc.getCell(`B${tocRow}`).value = `写真 ${photoCount}枚`;
          tocRow++;
        });

        // 各カテゴリ
        for (const cat of cats) {
          const v = dataMap[cat] || { date:'', location:'', details:'', photos:[] };
          const ws = wb.addWorksheet(sheetNameMap[cat], {
            pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
              margins: { left: 0.5, right: 0.5, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 } },
            headerFooter: { oddFooter: '&Rページ &P / &N' }
          });

          const colWidths = [4, 14, 14, 18, 14, 14, 18, 14, 14, 18]; // A〜J
          colWidths.forEach((w, i) => ws.getColumn(i+1).width = w);

          ws.getCell('A1').value = cat;
          ws.getCell('A1').style = sectionTitleStyle;

          ws.getCell('A3').value = '調査日'; ws.getCell('A3').style = labelStyle;
          ws.mergeCells('B3:J3'); ws.getCell('B3').value = v.date || (projectDateStr || '-'); ws.getCell('B3').numFmt = 'yyyy-mm-dd';

          ws.getCell('A4').value = '場所'; ws.getCell('A4').style = labelStyle;
          ws.mergeCells('B4:J4'); ws.getCell('B4').value = v.location || '-';

          ws.getCell('A5').value = '調査内容'; ws.getCell('A5').style = labelStyle;
          ws.mergeCells('B5:J6');
          ws.getCell('B5').value = (v.details || '').replace(/\r?\n/g, '\n');
          ws.getCell('B5').alignment = { wrapText: true, vertical: 'top' };
          ws.getCell('A3').border = { bottom: borderThin };
          ws.getCell('A4').border = { bottom: borderThin };
          ws.getCell('A5').border = { bottom: borderThin };
          ws.getCell('B3').border = { bottom: borderThin };
          ws.getCell('B4').border = { bottom: borderThin };
          ws.getCell('B5').border = { bottom: borderThin };

          let startRow = 8;
          const photos = v.photos || [];
          const perRow = 3;
          const blockRows = 12;
          const groups = [
            { img: ['B','C'], desc: 'D' },
            { img: ['E','F'], desc: 'G' },
            { img: ['H','I'], desc: 'J' }
          ];

          for (let i = 0; i < photos.length; i += perRow) {
            for (let r = startRow; r < startRow + blockRows; r++) ws.getRow(r).height = 18;

            for (let j = 0; j < perRow; j++) {
              const p = photos[i + j];
              if (!p) break;
              const cfg = groups[j];

              const imgRange = `${cfg.img[0]}${startRow}:${cfg.img[1]}${startRow + blockRows - 1}`;
              const descRange = `${cfg.desc}${startRow}:${cfg.desc}${startRow + blockRows - 1}`;

              ws.mergeCells(imgRange);
              ws.mergeCells(descRange);

              const descCell = ws.getCell(`${cfg.desc}${startRow}`);
              descCell.value = p.caption || '';
              descCell.alignment = { wrapText: true, vertical: 'top' };
              descCell.border = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };

              const ext = p.dataUrl.startsWith('data:image/png') ? 'png' : 'jpeg';
              const base64 = p.dataUrl.split(',')[1];
              const imageId = wb.addImage({ base64, extension: ext });
              ws.addImage(imageId, imgRange);

              const corners = [
                ws.getCell(`${cfg.img[0]}${startRow}`),
                ws.getCell(`${cfg.img[1]}${startRow}`),
                ws.getCell(`${cfg.img[0]}${startRow + blockRows - 1}`),
                ws.getCell(`${cfg.img[1]}${startRow + blockRows - 1}`)
              ];
              corners.forEach(c => c.border = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin });
            }

            startRow += (blockRows + 1);
          }
        }

        const buf = await wb.xlsx.writeBuffer();
        const fileName = `${title || 'report'}.xlsx`;
        saveAs(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileName);
      });

      // ユーティリティ
      function sanitizeSheetName(name) {
        const invalid = /[\\\/\?\*\[\]\:]/g;
        let n = (name || '').replace(invalid, ' ').trim();
        if (!n) n = 'シート';
        if (n.length > 31) n = n.slice(0, 31);
        return n;
      }
      function makeUniqueSheetName(base, used) {
        let n = base; let i = 2;
        while (used.has(n)) {
          const suffix = ` (${i})`;
          const core = base.slice(0, 31 - suffix.length);
          n = core + suffix; i++;
        }
        return n;
      }
      function formatDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${day}`;
      }
      function hashId(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h << 5) - h + str.charCodeAt(i) | 0;
        return Math.abs(h).toString(36);
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      }
    </script>
  </body>
</html>
